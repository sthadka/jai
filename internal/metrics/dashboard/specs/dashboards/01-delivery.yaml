id: delivery
title: Delivery speed
description: >-
  How fast do we ship? Headline cycle/lead time and completed volume, then
  distributions by priority and type and the completion trend. Every panel renders
  through the shared /q template and obeys the global filter bar (project + date
  range).
panels:
  - title: Cycle Time (p50)
    metric: cycle_time
    measure: cycle_time
    slice: none
    segment: none
    chart: number
    stat: p50
    defaults: { cohort: delivered }
  - title: Cycle Time (p95)
    measure: cycle_time
    slice: none
    segment: none
    chart: number
    stat: p95
    defaults: { cohort: delivered }
  - title: Lead Time (p50)
    metric: lead_time
    measure: lead_time
    slice: none
    segment: none
    chart: number
    stat: p50
    defaults: { cohort: delivered }
  - title: Issues Completed
    metric: throughput
    measure: throughput
    slice: none
    segment: none
    chart: number
    stat: n
    defaults: { cohort: delivered }
  - title: Cycle Time by Priority
    measure: cycle_time
    slice: priority
    segment: none
    chart: scatter
    defaults: { cohort: delivered }
  - title: Issues Completed by Month
    measure: throughput
    slice: period
    segment: none
    chart: line
    defaults: { cohort: delivered, grain: month }
  - title: Lead Time by Type
    measure: lead_time
    slice: type
    segment: none
    chart: bar
    defaults: { cohort: delivered }
  - title: Triage Time by Priority
    metric: triage_latency
    measure: triage_latency
    slice: priority
    segment: none
    chart: scatter
    defaults: { cohort: all }
