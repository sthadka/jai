id: backlog-sla
title: Backlog & SLA
description: >-
  Open-backlog ageing, blocker ageing (configured link types), and security SLA.
  Blocker ageing and security SLA are config-dependent: without the required
  metrics policy they render explicit unavailable cards, never fabricated data.
panels:
  - title: Aged open issues (age as-of now) by type
    metric: aged_open
    measure: aged_open
    slice: type
    segment: none
    chart: scatter
    defaults: { cohort: open }
  - title: Blocker ageing (open issues linked via a configured blocker type) by project
    metric: blocker_ageing
    measure: blocker_ageing
    slice: project
    segment: none
    chart: scatter
    requires: blocker_link_types
    defaults: { cohort: open }
  - title: Security SLA (remediation timing + compliance buckets)
    metric: security_sla
    chart: bar
    unavailable: >-
      security SLA needs configured deadlines (metrics.sla.security) and a
      remediation-timing / compliance-bucket query shape not served by the /q
      template; run `jai metrics security_sla`.
