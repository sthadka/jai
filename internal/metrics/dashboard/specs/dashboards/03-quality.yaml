id: quality
title: Quality / churn
description: >-
  Reopen, priority/rank/assignee churn, resolution mix and class ratio. Change
  counts are per-issue distributions over the changelog (server-authored grouped
  joins); mix/ratio are counts by resolution/type.
panels:
  - title: Reopen count per issue by type
    metric: reopen
    measure: reopen_count
    slice: type
    segment: none
    chart: scatter
    defaults: { cohort: all, grain: month }
  - title: Priority changes per issue by priority
    metric: priority_changes
    measure: priority_changes
    slice: priority
    segment: none
    chart: scatter
    defaults: { cohort: all, grain: month }
  - title: Rank volatility (rank changes per issue) by type
    metric: rank_volatility
    measure: rank_volatility
    slice: type
    segment: none
    chart: scatter
    defaults: { cohort: all, grain: month }
  - title: Reassignment count per issue by assignee
    metric: reassignment_count
    measure: reassignment_count
    slice: assignee
    segment: none
    chart: scatter
    defaults: { cohort: all, grain: month }
  - title: Reassignment thrash (changes beyond first) by assignee
    metric: reassignment_thrash
    measure: reassignment_thrash
    slice: assignee
    segment: none
    chart: scatter
    defaults: { cohort: all, grain: month }
  - title: Resolution mix
    metric: resolution_mix
    measure: throughput
    slice: resolution
    segment: none
    chart: bar
    defaults: { cohort: resolved, grain: month }
  - title: "Class ratio (type counts — e.g. bug : feature)"
    metric: ratio
    measure: throughput
    slice: type
    segment: none
    chart: bar
    defaults: { cohort: resolved, grain: month }
