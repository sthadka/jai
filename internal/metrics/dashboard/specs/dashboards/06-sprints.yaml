id: sprints
title: Sprints
description: >-
  Per-sprint eventual resolution of ever-members, plus membership-sliced delivery.
  Sprint membership is event-time (fact_issue_membership), so a GROUP BY never
  double-counts an issue's measure across sprints.
panels:
  - title: Sprint resolution (eventual resolution of ever-members)
    metric: sprint_resolution
    measure: throughput
    slice: sprint
    segment: resolution
    chart: bar
    defaults: { cohort: resolved, grain: month }
  - title: Cycle time by sprint (membership-sliced delivery)
    measure: cycle_time
    slice: sprint
    segment: none
    chart: scatter
    defaults: { cohort: delivered, grain: month }
