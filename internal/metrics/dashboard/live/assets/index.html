<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jai · live flow metrics</title>
<!-- Vendored Apache ECharts runtime + IBM Plex Sans font, served from this
     localhost server. NO CDN: the only external references are /assets/*. -->
<script src="/assets/echarts.min.js"></script>
<style>
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("/assets/fonts/ibm-plex-sans-latin.woff2") format("woff2");
    font-weight: 100 700;
    font-style: normal;
    font-display: swap;
  }
  :root {
    color-scheme: light dark;
    --bg: #fbfbfc;
    --panel: #ffffff;
    --fg: #1c1d21;
    --muted: #6b6e76;
    --border: #e6e6e8;
    --shadow: 0 1px 2px rgba(20,20,30,0.05), 0 1px 3px rgba(20,20,30,0.04);
    --accent: #5b6ccf;
    --chip-bg: #6b6e7614;
    --band: #8891a8;
    --c1: #5b6ccf; --c2: #2b9fb3; --c3: #d7922f; --c4: #c76a8d; --c5: #8470d6; --c6: #5c7080;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1013;
      --panel: #16181d;
      --fg: #e7e8ea;
      --muted: #9a9da6;
      --border: #26282e;
      --shadow: 0 1px 2px rgba(0,0,0,0.4);
      --chip-bg: #9a9da622;
      --band: #5a6478;
      --c1: #7d8bf0; --c2: #3fc0d4; --c3: #e6ad55; --c4: #e086a7; --c5: #a494ea; --c6: #7f93a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.45; margin: 0; color: var(--fg); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .topbar { display: flex; align-items: baseline; gap: 12px; padding: 12px 20px 6px; flex-wrap: wrap; }
  .topbar h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .topbar .gen { font-size: 12px; color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 6px 20px 14px; align-items: flex-end; }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .filters select, .filters input {
    font: inherit; font-size: 13px; padding: 5px 8px; min-width: 130px; color: var(--fg);
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  }
  .filters .hide { display: none; }
  main { padding: 18px 20px 40px; }
  #desc { font-size: 12.5px; color: var(--muted); max-width: 80ch; margin: 0 0 16px; }
  #tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 14px 16px; min-height: 92px;
  }
  .tile-val { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .tile-label { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .tile .delta { display: inline-block; margin-top: 8px; font-size: 11.5px; color: var(--muted); background: var(--chip-bg); border-radius: 20px; padding: 2px 8px; }
  .tile.unavailable { border-style: dashed; }
  #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 14px 16px 10px; display: flex; flex-direction: column;
  }
  .panel h3 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
  .panel .pmeta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .panel .pchart { width: 100%; height: 300px; }
  .panel .pstatus { font-size: 11px; color: var(--muted); min-height: 14px; margin-top: 4px; }
  .panel .pstatus.err { color: #d14b4b; font-weight: 600; }
  .panel.unavailable { border-style: dashed; }
  .unavail { font-size: 12px; padding: 14px; background: var(--chip-bg); border-left: 3px solid var(--c3); border-radius: 4px; color: var(--fg); }
  .unavail b { text-transform: uppercase; letter-spacing: 0.05em; font-size: 10.5px; color: var(--c3); display: block; margin-bottom: 4px; }
  details.sqlbox { margin-top: 6px; font-size: 11px; color: var(--muted); }
  details.sqlbox pre { overflow: auto; padding: 8px; background: var(--chip-bg); border-radius: 6px; font-size: 11px; margin: 6px 0 0; }
  #explore .ex-controls { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 16px; align-items: flex-end; }
  #explore .ex-controls label { display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  #explore .ex-controls select { font: inherit; font-size: 13px; padding: 5px 8px; min-width: 130px; color: var(--fg); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
  #explore .pchart { width: 100%; height: 440px; }
  #globalErr { padding: 10px 20px; color: #d14b4b; font-weight: 600; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <h1>jai · flow metrics</h1>
    <span class="gen" id="gen"></span>
  </div>
  <div class="filters">
    <label>Dashboard
      <select id="fDashboard"></select>
    </label>
    <label>Project
      <select id="fProject"></select>
    </label>
    <label>Date range
      <select id="fPreset">
        <option value="all">All time</option>
        <option value="week">Last week</option>
        <option value="month">Last month</option>
        <option value="quarter">Last quarter</option>
        <option value="year">Last year</option>
        <option value="custom">Custom</option>
      </select>
    </label>
    <label class="hide" id="fFromWrap">From
      <input type="date" id="fFrom">
    </label>
    <label class="hide" id="fToWrap">To
      <input type="date" id="fTo">
    </label>
    <label>Segment
      <select id="fSegment"></select>
    </label>
  </div>
</header>
<div id="globalErr"></div>
<main>
  <p id="desc"></p>
  <div id="tiles"></div>
  <div id="grid"></div>
  <section id="explore" style="display:none">
    <div class="ex-controls">
      <label>Measure <select id="exMeasure"></select></label>
      <label>Slice <select id="exSlice"></select></label>
      <label>Cohort <select id="exCohort"></select></label>
      <label>Grain <select id="exGrain"></select></label>
      <label>Chart
        <select id="exChart">
          <option value="bar">Bar</option>
          <option value="line">Line</option>
          <option value="area">Area</option>
          <option value="scatter">Scatter (p50/p85/p95)</option>
        </select>
      </label>
    </div>
    <div class="panel">
      <div id="exChartDiv" class="pchart"></div>
      <div id="exStatus" class="pstatus"></div>
      <details class="sqlbox"><summary>Generated SQL (read-only)</summary><pre id="exSql"></pre></details>
    </div>
  </section>
</main>

<script>
"use strict";
const EXPLORE = "__explore__";

const state = {
  view: null,          // dashboard id or EXPLORE
  built: null,         // which view's DOM/instances are currently built
  project: "all",
  preset: "all",
  customFrom: "",
  customTo: "",
  segment: "none",
};

let META = null;
let DASHBOARDS = [];
const MEASURE_LABEL = {}, MEASURE_UNIT = {}, DIM_LABEL = {}, COHORT_LABEL = {};
let chartPanels = [];   // [{panel, chart, statusEl, sqlPre}]  persistent ECharts instances
let tilePanels = [];    // [{panel, el}]
let exploreChart = null;

// ---------------------------------------------------------------------------
// Fetch helpers
// ---------------------------------------------------------------------------
function qURL(p) {
  const u = new URLSearchParams();
  for (const k in p) if (p[k] !== undefined && p[k] !== null && p[k] !== "") u.set(k, p[k]);
  return "/q?" + u.toString();
}
async function runQ(p) {
  const r = await fetch(qURL(p));
  const j = await r.json();
  if (!r.ok) throw new Error(j && j.error ? j.error : ("HTTP " + r.status));
  return j; // {sql, rows}
}

// ---------------------------------------------------------------------------
// Date math (client-side presets + prior window)
// ---------------------------------------------------------------------------
function toDate(s) { const a = s.split("-").map(Number); return new Date(Date.UTC(a[0], a[1] - 1, a[2])); }
function fmtDate(dt) { return dt.toISOString().slice(0, 10); }
function addDays(dt, n) { const d = new Date(dt); d.setUTCDate(d.getUTCDate() + n); return d; }
function addMonths(dt, n) { const d = new Date(dt); d.setUTCMonth(d.getUTCMonth() + n); return d; }

function activeRange() {
  if (state.preset === "custom") return { from: state.customFrom, to: state.customTo };
  if (state.preset === "all") return { from: "", to: "" };
  const today = toDate(fmtDate(new Date()));
  const toExcl = addDays(today, 1);
  let from;
  if (state.preset === "week") from = addDays(today, -7);
  else if (state.preset === "month") from = addMonths(today, -1);
  else if (state.preset === "quarter") from = addMonths(today, -3);
  else if (state.preset === "year") from = addMonths(today, -12);
  else return { from: "", to: "" };
  return { from: fmtDate(from), to: fmtDate(toExcl) };
}
function priorRange(from, to) {
  if (!from || !to) return null;
  const f = toDate(from), t = toDate(to);
  const len = Math.round((t - f) / 86400000);
  if (len <= 0) return null;
  return { from: fmtDate(addDays(f, -len)), to: fmtDate(f) };
}

// ---------------------------------------------------------------------------
// Params assembly: global bar (project/date/segment) + per-panel measure/slice/etc
// ---------------------------------------------------------------------------
function globalParams() {
  const g = {};
  if (state.project && state.project !== "all") g.project = state.project;
  const r = activeRange();
  if (r.from) g.from = r.from;
  if (r.to) g.to = r.to;
  return g;
}
function panelParams(panel, extra) {
  const p = globalParams();
  p.measure = panel.measure;
  p.slice = panel.slice || "none";
  const d = panel.defaults || {};
  if (d.cohort) p.cohort = d.cohort;
  if (d.grain) p.grain = d.grain;
  if (panel.chart !== "number" && state.segment && state.segment !== "none") p.segment = state.segment;
  return Object.assign(p, extra || {});
}

// ---------------------------------------------------------------------------
// Stats / formatting
// ---------------------------------------------------------------------------
function statKey(panel) {
  if (panel.stat) return panel.stat;
  return panel.measure === "throughput" ? "n" : "p50";
}
function unitOf(panel) { return panel.unit || MEASURE_UNIT[panel.measure] || "count"; }
function trimNum(n) {
  n = Number(n);
  if (!isFinite(n)) return "—";
  if (Math.abs(n) >= 1000) return Math.round(n).toLocaleString();
  const r = Math.round(n * 10) / 10;
  return r.toString();
}
function fmtVal(v, unit) {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  if (unit === "days") return (Math.round(n * 10) / 10) + "d";
  if (unit === "ratio") return (Math.round(n * 100) / 100).toFixed(2);
  if (unit === "points") return trimNum(n) + " pts";
  return trimNum(n);
}
function statLabel(panel) {
  const k = statKey(panel);
  return { p50: "median", p85: "p85", p95: "p95", avg: "avg", n: "count", total: "total" }[k] || k;
}
function measureLabel(m) { return MEASURE_LABEL[m] || m; }

// ---------------------------------------------------------------------------
// Theme / ECharts option builders
// ---------------------------------------------------------------------------
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function theme() { return { fg: cssVar("--fg"), muted: cssVar("--muted"), border: cssVar("--border"), band: cssVar("--band") }; }
function palette() { return ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map(cssVar); }

function catAxis(cats) {
  const t = theme();
  return {
    type: "category", data: cats,
    axisLine: { lineStyle: { color: t.border } },
    axisTick: { show: false },
    axisLabel: { color: t.muted, interval: 0, rotate: cats.length > 6 ? 35 : 0, hideOverlap: true, formatter: shortCat },
  };
}
function timeAxis(cats) {
  const t = theme();
  return {
    type: "category", data: cats,
    axisLine: { lineStyle: { color: t.border } },
    axisTick: { show: false },
    axisLabel: { color: t.muted, rotate: cats.length > 8 ? 35 : 0, hideOverlap: true, formatter: shortCat },
  };
}
function valAxis() {
  const t = theme();
  return { type: "value", splitLine: { lineStyle: { color: t.border } }, axisLabel: { color: t.muted } };
}
function shortCat(v) {
  if (typeof v !== "string") return v;
  const m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + "-" + m[2];   // YYYY-MM for period labels
  return v.length > 18 ? v.slice(0, 17) + "…" : v;
}
function baseOption(o) {
  const t = theme();
  const opt = {
    color: palette(),
    textStyle: { fontFamily: "IBM Plex Sans", color: t.fg },
    grid: { left: 10, right: 16, top: o.legend ? 34 : 16, bottom: 10, containLabel: true },
    tooltip: o.tooltip || { trigger: "axis", textStyle: { fontFamily: "IBM Plex Sans" } },
    toolbox: { right: 8, top: 4, feature: { saveAsImage: { title: "Save", pixelRatio: 2 } }, iconStyle: { borderColor: t.muted } },
  };
  for (const k of ["xAxis", "yAxis", "series", "legend"]) if (o[k] !== undefined) opt[k] = o[k];
  if (opt.legend) opt.legend = Object.assign({ top: 0, textStyle: { color: t.muted, fontFamily: "IBM Plex Sans" } }, opt.legend);
  return opt;
}

function yVal(row, panel) { return row[statKey(panel)]; }

function barOption(panel, rows) {
  const pal = palette();
  const segs = [...new Set(rows.map(r => r.segment))];
  const hasSeg = state.segment && state.segment !== "none" && segs.length > 1 && segs.some(s => s !== "");
  const totals = {};
  rows.forEach(r => { totals[r.slice] = (totals[r.slice] || 0) + Number(yVal(r, panel) || 0); });
  const cats = Object.keys(totals).sort((a, b) => totals[b] - totals[a]).slice(0, 40);
  let series;
  if (hasSeg) {
    series = segs.map((s, i) => ({
      name: s === "" ? "(none)" : s, type: "bar", stack: "t",
      itemStyle: { borderRadius: [3, 3, 0, 0], color: pal[i % pal.length] },
      data: cats.map(c => { const row = rows.find(r => r.slice === c && r.segment === s); return row ? Number(yVal(row, panel)) : 0; }),
    }));
  } else {
    series = [{
      type: "bar", itemStyle: { borderRadius: [4, 4, 0, 0], color: pal[0] },
      data: cats.map(c => { const row = rows.find(r => r.slice === c); return row ? Number(yVal(row, panel)) : 0; }),
    }];
  }
  return baseOption({ xAxis: catAxis(cats), yAxis: valAxis(), series, legend: hasSeg ? {} : undefined });
}

function lineOption(panel, rows) {
  const pal = palette();
  const area = panel.chart === "area";
  const segs = [...new Set(rows.map(r => r.segment))];
  const hasSeg = state.segment && state.segment !== "none" && segs.length > 1 && segs.some(s => s !== "");
  const cats = [...new Set(rows.map(r => r.slice))].sort();   // periods ascending
  let series;
  if (hasSeg) {
    series = segs.map((s, i) => ({
      name: s === "" ? "(none)" : s, type: "line", showSymbol: false,
      lineStyle: { color: pal[i % pal.length] }, itemStyle: { color: pal[i % pal.length] },
      areaStyle: area ? { opacity: 0.18 } : undefined,
      data: cats.map(c => { const row = rows.find(r => r.slice === c && r.segment === s); return row ? Number(yVal(row, panel)) : null; }),
    }));
  } else {
    series = [{
      type: "line", showSymbol: true, symbolSize: 5,
      lineStyle: { color: pal[0], width: 2 }, itemStyle: { color: pal[0] },
      areaStyle: area ? gradient(pal[0]) : undefined,
      data: cats.map(c => { const row = rows.find(r => r.slice === c); return row ? Number(yVal(row, panel)) : null; }),
    }];
  }
  return baseOption({ xAxis: timeAxis(cats), yAxis: valAxis(), series, legend: hasSeg ? {} : undefined });
}
function gradient(color) {
  return { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: color + "55" }, { offset: 1, color: color + "05" }]) };
}

function scatterOption(panel, rows) {
  const pal = palette();
  const t = theme();
  const sorted = rows.slice().sort((a, b) => Number(b.p50 || 0) - Number(a.p50 || 0)).slice(0, 40);
  const names = sorted.map(r => r.slice);
  const mk = key => sorted.map((r, i) => [i, r[key] == null ? null : Number(r[key])]);
  const band = sorted.map((r, i) => ({ value: [i, Number(r.p50 || 0), Number(r.p95 || 0)] }));
  const renderBand = (params, api) => {
    const x = api.coord([api.value(0), api.value(1)])[0];
    const yLow = api.coord([api.value(0), api.value(1)])[1];
    const yHigh = api.coord([api.value(0), api.value(2)])[1];
    return { type: "line", shape: { x1: x, y1: yLow, x2: x, y2: yHigh }, style: { stroke: t.band, lineWidth: 7, opacity: 0.28 } };
  };
  const series = [
    { type: "custom", silent: true, renderItem: renderBand, data: band, z: 1 },
    { name: "p50", type: "scatter", symbolSize: 10, itemStyle: { color: pal[0] }, data: mk("p50"), z: 3 },
    { name: "p85", type: "scatter", symbolSize: 9, itemStyle: { color: pal[2] }, data: mk("p85"), z: 3 },
    { name: "p95", type: "scatter", symbolSize: 9, itemStyle: { color: pal[3] }, data: mk("p95"), z: 3 },
  ];
  return baseOption({
    xAxis: catAxis(names), yAxis: valAxis(),
    legend: { data: ["p50", "p85", "p95"] },
    series,
    tooltip: {
      trigger: "item", textStyle: { fontFamily: "IBM Plex Sans" },
      formatter: pt => {
        const r = sorted[pt.value[0]];
        if (!r) return "";
        return `${r.slice}<br/>n = ${r.n}<br/>p50 = ${r.p50}<br/>p85 = ${r.p85}<br/>p95 = ${r.p95}`;
      },
    },
  });
}

function buildOption(panel, rows) {
  switch (panel.chart) {
    case "scatter": return scatterOption(panel, rows);
    case "line": case "area": return lineOption(panel, rows);
    default: return barOption(panel, rows);
  }
}

// ---------------------------------------------------------------------------
// Rendering: dashboards (tiles + charts) and explore
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);

function disposeAll() {
  chartPanels.forEach(p => { try { p.chart.dispose(); } catch (e) {} });
  chartPanels = [];
  tilePanels = [];
  $("tiles").innerHTML = "";
  $("grid").innerHTML = "";
}

function buildDashboard(d) {
  disposeAll();
  $("desc").textContent = d.description || "";
  const tilesRow = $("tiles"), grid = $("grid");
  for (const panel of d.panels) {
    if (panel.chart === "number") {
      const el = document.createElement("div");
      el.className = "tile";
      el.innerHTML = `<div class="tile-val">…</div><div class="tile-label">${measureLabel(panel.measure)} · ${statLabel(panel)}</div>`;
      tilesRow.appendChild(el);
      tilePanels.push({ panel, el });
      continue;
    }
    const card = document.createElement("div");
    card.className = "panel";
    const h = document.createElement("h3"); h.textContent = panel.title; card.appendChild(h);
    const meta = document.createElement("div"); meta.className = "pmeta";
    meta.textContent = panelMeta(panel); card.appendChild(meta);
    if (panel.unavailable) {
      card.classList.add("unavailable");
      const u = document.createElement("div"); u.className = "unavail";
      u.innerHTML = "<b>Unavailable</b>" + escapeHTML(panel.unavailable);
      card.appendChild(u);
      grid.appendChild(card);
      continue;
    }
    const chartDiv = document.createElement("div"); chartDiv.className = "pchart"; card.appendChild(chartDiv);
    const status = document.createElement("div"); status.className = "pstatus"; card.appendChild(status);
    const det = document.createElement("details"); det.className = "sqlbox";
    det.innerHTML = "<summary>Generated SQL (read-only)</summary><pre></pre>";
    card.appendChild(det);
    grid.appendChild(card);
    const chart = echarts.init(chartDiv, null, { renderer: "canvas" });
    chartPanels.push({ panel, chart, statusEl: status, sqlPre: det.querySelector("pre") });
  }
}
function panelMeta(panel) {
  const parts = [measureLabel(panel.measure)];
  if (panel.slice && panel.slice !== "none") parts.push("by " + (DIM_LABEL[panel.slice] || panel.slice));
  const d = panel.defaults || {};
  if (d.cohort) parts.push(COHORT_LABEL[d.cohort] || d.cohort);
  return parts.join(" · ");
}

async function refreshTiles() {
  const r = activeRange();
  const pr = priorRange(r.from, r.to);
  await Promise.all(tilePanels.map(async tp => {
    try {
      const cur = await runQ(panelParams(tp.panel, { slice: "none" }));
      const row = (cur.rows && cur.rows[0]) || null;
      const k = statKey(tp.panel);
      const unit = k === "n" ? "count" : unitOf(tp.panel);
      const text = fmtVal(row ? row[k] : null, unit);
      let chip = "";
      if (pr) {
        const prev = await runQ(panelParams(tp.panel, { slice: "none", from: pr.from, to: pr.to }));
        const prow = (prev.rows && prev.rows[0]) || null;
        const d = delta(row ? row[k] : null, prow ? prow[k] : null);
        if (d) chip = `<span class="delta">${d.up ? "▲" : "▼"} ${d.pct}%</span>`;
      }
      tp.el.innerHTML = `<div class="tile-val">${text}</div>` +
        `<div class="tile-label">${measureLabel(tp.panel.measure)} · ${statLabel(tp.panel)}</div>` + chip;
    } catch (e) {
      tp.el.innerHTML = `<div class="tile-val">—</div><div class="tile-label">${escapeHTML(e.message)}</div>`;
    }
  }));
}
function delta(cur, prev) {
  if (cur == null || prev == null) return null;
  const c = Number(cur), p = Number(prev);
  if (!isFinite(c) || !isFinite(p) || p === 0) return null;
  return { up: c >= p, pct: Math.abs((c - p) / Math.abs(p) * 100).toFixed(0) };
}

async function refreshCharts() {
  await Promise.all(chartPanels.map(async cp => {
    cp.statusEl.textContent = "loading…"; cp.statusEl.className = "pstatus";
    try {
      const res = await runQ(panelParams(cp.panel));
      cp.sqlPre.textContent = res.sql || "";
      const rows = res.rows || [];
      if (!rows.length) { cp.chart.clear(); cp.statusEl.textContent = "no data in scope"; return; }
      cp.statusEl.textContent = "";
      cp.chart.setOption(buildOption(cp.panel, rows), true);
      cp.chart.resize();
    } catch (e) {
      cp.chart.clear();
      cp.statusEl.textContent = e.message; cp.statusEl.className = "pstatus err";
    }
  }));
}

// Explore -------------------------------------------------------------------
function explorePanel() {
  return {
    title: "Explore", measure: $("exMeasure").value, slice: $("exSlice").value,
    chart: $("exChart").value, defaults: { cohort: $("exCohort").value, grain: $("exGrain").value },
  };
}
async function refreshExplore() {
  const panel = explorePanel();
  $("exStatus").textContent = "loading…"; $("exStatus").className = "pstatus";
  try {
    const res = await runQ(panelParams(panel));
    $("exSql").textContent = res.sql || "";
    const rows = res.rows || [];
    if (!rows.length) { exploreChart.clear(); $("exStatus").textContent = "no data in scope"; return; }
    $("exStatus").textContent = "";
    exploreChart.setOption(buildOption(panel, rows), true);
    exploreChart.resize();
  } catch (e) {
    exploreChart.clear();
    $("exStatus").textContent = e.message; $("exStatus").className = "pstatus err";
  }
}

// View orchestration --------------------------------------------------------
function buildCurrentView() {
  if (state.view === EXPLORE) {
    $("desc").style.display = "none";
    $("tiles").style.display = "none";
    $("grid").style.display = "none";
    $("explore").style.display = "";
    disposeAll();
    if (!exploreChart) exploreChart = echarts.init($("exChartDiv"), null, { renderer: "canvas" });
  } else {
    $("desc").style.display = "";
    $("tiles").style.display = "";
    $("grid").style.display = "";
    $("explore").style.display = "none";
    const d = DASHBOARDS.find(x => x.id === state.view) || DASHBOARDS[0];
    if (d) { state.view = d.id; buildDashboard(d); }
  }
  state.built = state.view;
  refreshCurrent();
}
function refreshCurrent() {
  if (state.view === EXPLORE) { refreshExplore(); return; }
  refreshTiles();
  refreshCharts();
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
function escapeHTML(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function opt(value, label) { const o = document.createElement("option"); o.value = value; o.textContent = label; return o; }

function populateControls() {
  META.measures.forEach(m => { MEASURE_LABEL[m.value] = m.label; MEASURE_UNIT[m.value] = m.unit; });
  META.dimensions.forEach(d => { DIM_LABEL[d.value] = d.label; });
  META.cohorts.forEach(c => { COHORT_LABEL[c.value] = c.label; });

  $("gen").textContent = META.generation != null ? ("generation " + META.generation) : "";

  const fd = $("fDashboard");
  DASHBOARDS.forEach(d => fd.appendChild(opt(d.id, d.title)));
  fd.appendChild(opt(EXPLORE, "Explore (ad-hoc)"));

  const fp = $("fProject");
  fp.appendChild(opt("all", "All projects"));
  (META.projects || []).forEach(p => fp.appendChild(opt(p, p)));

  const fs = $("fSegment");
  META.dimensions.forEach(d => fs.appendChild(opt(d.value, d.label)));
  fs.value = "none";

  // Explore controls
  META.measures.forEach(m => $("exMeasure").appendChild(opt(m.value, m.label)));
  META.dimensions.forEach(d => $("exSlice").appendChild(opt(d.value, d.label)));
  META.cohorts.forEach(c => $("exCohort").appendChild(opt(c.value, c.label)));
  META.grains.forEach(g => $("exGrain").appendChild(opt(g.value, g.label)));
  $("exMeasure").value = "cycle_time";
  $("exSlice").value = "priority";
  $("exCohort").value = "delivered";
  $("exGrain").value = "month";
}

function wireEvents() {
  $("fDashboard").addEventListener("change", e => { state.view = e.target.value; buildCurrentView(); });
  $("fProject").addEventListener("change", e => { state.project = e.target.value; refreshCurrent(); });
  $("fSegment").addEventListener("change", e => { state.segment = e.target.value; refreshCurrent(); });
  $("fPreset").addEventListener("change", e => {
    state.preset = e.target.value;
    const custom = state.preset === "custom";
    $("fFromWrap").classList.toggle("hide", !custom);
    $("fToWrap").classList.toggle("hide", !custom);
    if (!custom) refreshCurrent();
  });
  $("fFrom").addEventListener("change", e => { state.customFrom = e.target.value; if (state.preset === "custom") refreshCurrent(); });
  $("fTo").addEventListener("change", e => { state.customTo = e.target.value; if (state.preset === "custom") refreshCurrent(); });

  ["exMeasure", "exSlice", "exCohort", "exGrain", "exChart"].forEach(id =>
    $(id).addEventListener("change", () => { if (state.view === EXPLORE) refreshExplore(); }));

  window.addEventListener("resize", () => {
    chartPanels.forEach(c => c.chart.resize());
    if (exploreChart) exploreChart.resize();
  });
  // Re-theme ECharts on light/dark switch (CSS vars drive colors read at build time).
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", () => refreshCurrent());
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
async function boot() {
  try {
    const [meta, dash] = await Promise.all([
      fetch("/meta").then(r => r.json()),
      fetch("/dashboards").then(r => r.json()),
    ]);
    META = meta;
    DASHBOARDS = (dash && dash.dashboards) || [];
    populateControls();
    wireEvents();
    try { await document.fonts.load('14px "IBM Plex Sans"'); } catch (e) {}
    state.view = DASHBOARDS.length ? DASHBOARDS[0].id : EXPLORE;
    $("fDashboard").value = state.view;
    buildCurrentView();
  } catch (e) {
    $("globalErr").textContent = "Failed to load dashboard: " + e.message;
  }
}
boot();
</script>
