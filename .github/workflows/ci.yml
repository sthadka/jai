name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install zig (for CGO cross-compilation)
        run: |
          wget -q https://ziglang.org/download/0.12.0/zig-linux-x86_64-0.12.0.tar.xz
          tar -xf zig-linux-x86_64-0.12.0.tar.xz
          echo "$PWD/zig-linux-x86_64-0.12.0" >> $GITHUB_PATH

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Verify module path matches release major
        run: |
          maj=$(jq -r '."." | split(".")[0]' .release-please-manifest.json)
          mod=$(go list -m)
          if [ "$maj" -ge 2 ]; then
            case "$mod" in
              */v$maj) echo "ok: $mod matches v$maj" ;;
              *) echo "::error::module path '$mod' must end in /v$maj (release manifest major is $maj) — bump go.mod + imports on every major"; exit 1 ;;
            esac
          fi

      - name: Verify library is embeddable (separate module)
        run: cd examples/embed && go test -tags fts5 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --build-tags fts5
          only-new-issues: true

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Install zig
        run: |
          wget -q https://ziglang.org/download/0.12.0/zig-linux-x86_64-0.12.0.tar.xz
          tar -xf zig-linux-x86_64-0.12.0.tar.xz
          echo "$PWD/zig-linux-x86_64-0.12.0" >> $GITHUB_PATH

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
